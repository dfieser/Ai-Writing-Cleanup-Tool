name: checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  self-check:
    name: run the checker on our own docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Report on every public document
        run: |
          for doc in README.md AGENTS.md CLAUDE.md CONTRIBUTING.md CHANGELOG.md \
                     examples/*.md wiki/*.md; do
            echo "::group::$doc"
            python3 skills/ai-writing-cleanup/scripts/check_writing.py "$doc"
            echo "::endgroup::"
          done

      # Gated on the mechanical categories only. The heuristics group fails on
      # correct prose, so gating a build on it would block good writing.
      # examples/before.md and wiki/The-Rules.md quote bad writing to teach it,
      # so both report defects on purpose and stay off this list.
      - name: Gate the public documents
        run: |
          status=0
          docs="README.md AGENTS.md CLAUDE.md CONTRIBUTING.md CHANGELOG.md"
          docs="$docs examples/after.md wiki/Home.md wiki/Checker-Reference.md"
          docs="$docs wiki/Editing-Workflow.md wiki/FAQ.md"
          for doc in $docs; do
            if ! python3 skills/ai-writing-cleanup/scripts/check_writing.py \
                 "$doc" --quiet --fail-on mechanics; then
              echo "::error file=$doc::$doc fails the mechanical checks"
              status=1
            fi
          done
          exit $status

      - name: Confirm the checker still catches a dirty document
        run: |
          if python3 skills/ai-writing-cleanup/scripts/check_writing.py \
               examples/before.md --quiet --fail-on mechanics; then
            echo "::error::examples/before.md should fail the gate but passed"
            exit 1
          fi
          echo "the dirty example still fails the gate, as intended"

      - name: Confirm the exit codes agents rely on
        run: |
          python3 skills/ai-writing-cleanup/scripts/check_writing.py \
            AGENTS.md --json > /tmp/report.json
          python3 -c "
          import json, sys
          d = json.load(open('/tmp/report.json'))
          for key in ('verdict', 'counts', 'totals', 'gate', 'findings', 'notes'):
              assert key in d, 'missing key: ' + key
          print('json report OK, verdict:', d['verdict'])
          "
          python3 skills/ai-writing-cleanup/scripts/check_writing.py \
            AGENTS.md --fail-on nonsense > /dev/null 2>&1 && \
            { echo '::error::a bad category should exit 2'; exit 1; }
          echo "exit codes OK"

  artifacts:
    name: generated artifacts are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the bundle matches the skill sources
        run: python3 tools/build_bundle.py --check

      - name: Check the version is stamped everywhere
        run: python3 tools/sync_version.py --check

      - name: Check the upload package builds
        run: python3 tools/build_release.py --check

      - name: Check the checker reports the same version
        run: |
          stamped=$(python3 -c "
          import json
          print(json.load(open('.claude-plugin/plugin.json'))['version'])
          ")
          reported=$(python3 skills/ai-writing-cleanup/scripts/check_writing.py \
            --version | awk '{print $2}')
          echo "plugin.json=$stamped  check_writing.py=$reported"
          [ "$stamped" = "$reported" ] || {
            echo "::error::the checker reports $reported, plugin.json says $stamped"
            exit 1
          }

      - name: Build the upload package and keep it
        run: python3 tools/build_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: ai-writing-cleanup-skill
          path: dist/ai-writing-cleanup-*.zip
          if-no-files-found: error

  manifests:
    name: validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifests parse and carry the fields we rely on
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          plugin = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text())
          market = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text())

          failures = []
          for field in ("name", "version", "description", "author", "skills"):
              if field not in plugin:
                  failures.append(f"plugin.json is missing {field}")
          for field in ("name", "description", "owner", "plugins"):
              if field not in market:
                  failures.append(f"marketplace.json is missing {field}")

          for rel in plugin.get("skills", []):
              skill = pathlib.Path(rel) / "SKILL.md"
              if not skill.is_file():
                  failures.append(f"plugin.json points at {rel}, which has no SKILL.md")

          names = [p.get("name") for p in market.get("plugins", [])]
          if plugin.get("name") not in names:
              failures.append(f"marketplace.json does not list {plugin.get('name')}")

          for line in failures:
              print(f"::error::{line}")
          sys.exit(1 if failures else 0)
          PY
